<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <clipPath id="phone">
      <rect x="0" y="0" width="412" height="915" rx="40" ry="40"/>
    </clipPath>
  </defs>
  <g clip-path="url(#phone)">
    <rect width="412" height="915" fill="#0e0e10"/>

    <!-- Status bar (connesso) -->
    <rect x="0" y="0" width="412" height="32" fill="#1a3a1a"/>
    <circle cx="14" cy="16" r="4" fill="#9f9"/>
    <text x="24" y="20" font-size="12" fill="#9f9">Connesso</text>
    <rect x="290" y="6" width="38" height="20" rx="6" fill="none" stroke="#9f9"/>
    <text x="309" y="20" text-anchor="middle" font-size="14" fill="#9f9">🎵</text>
    <rect x="334" y="6" width="68" height="20" rx="6" fill="none" stroke="#9f9"/>
    <text x="368" y="20" text-anchor="middle" font-size="11" fill="#9f9">Reconnect</text>

    <!-- Pad -->
    <rect x="6" y="38" width="400" height="320" rx="14" fill="#16161a" stroke="#2a2a30"/>
    <text x="206" y="180" text-anchor="middle" font-size="13" fill="#666">Trackpad</text>
    <text x="206" y="208" text-anchor="middle" font-size="11" fill="#555">1 dito = muovi · tap = sx · 2 dita tap = dx</text>
    <text x="206" y="224" text-anchor="middle" font-size="11" fill="#555">doppio-tap-tieni = drag · 2 dita scorri = scroll</text>

    <!-- Row click sx/dx/lock -->
    <g transform="translate(6,368)">
      <rect x="0" y="0" width="130" height="44" rx="8" fill="#2a4a6a" stroke="#4a7a9a"/>
      <text x="65" y="28" text-anchor="middle" font-size="14" fill="#eee">Click SX</text>
      <rect x="135" y="0" width="130" height="44" rx="8" fill="#2a4a6a" stroke="#4a7a9a"/>
      <text x="200" y="28" text-anchor="middle" font-size="14" fill="#eee">Click DX</text>
      <rect x="270" y="0" width="130" height="44" rx="8" fill="#22232a" stroke="#33343d"/>
      <text x="335" y="28" text-anchor="middle" font-size="14" fill="#eee">🔒 Blocca</text>
    </g>

    <!-- Modificatori -->
    <g transform="translate(6,418)">
      <rect x="0" y="0" width="97" height="44" rx="8" fill="#22232a" stroke="#33343d"/>
      <text x="48" y="28" text-anchor="middle" font-size="14" fill="#eee">Ctrl</text>
      <rect x="101" y="0" width="97" height="44" rx="8" fill="#22232a" stroke="#33343d"/>
      <text x="149" y="28" text-anchor="middle" font-size="14" fill="#eee">Shift</text>
      <rect x="202" y="0" width="97" height="44" rx="8" fill="#22232a" stroke="#33343d"/>
      <text x="250" y="28" text-anchor="middle" font-size="14" fill="#eee">Alt</text>
      <rect x="303" y="0" width="97" height="44" rx="8" fill="#22232a" stroke="#33343d"/>
      <text x="351" y="28" text-anchor="middle" font-size="14" fill="#eee">⌘/Super</text>
    </g>

    <!-- Tasti speciali x8 -->
    <g transform="translate(6,468)" font-size="14" fill="#eee">
      <rect x="0"   y="0" width="46.5" height="44" rx="8" fill="#22232a" stroke="#33343d"/><text x="23.25" y="28" text-anchor="middle">Esc</text>
      <rect x="50.5" y="0" width="46.5" height="44" rx="8" fill="#22232a" stroke="#33343d"/><text x="73.75" y="28" text-anchor="middle">Tab</text>
      <rect x="101" y="0" width="46.5" height="44" rx="8" fill="#22232a" stroke="#33343d"/><text x="124.25" y="28" text-anchor="middle">↑</text>
      <rect x="151.5" y="0" width="46.5" height="44" rx="8" fill="#22232a" stroke="#33343d"/><text x="174.75" y="28" text-anchor="middle">↓</text>
      <rect x="202" y="0" width="46.5" height="44" rx="8" fill="#22232a" stroke="#33343d"/><text x="225.25" y="28" text-anchor="middle">←</text>
      <rect x="252.5" y="0" width="46.5" height="44" rx="8" fill="#22232a" stroke="#33343d"/><text x="275.75" y="28" text-anchor="middle">→</text>
      <rect x="303" y="0" width="46.5" height="44" rx="8" fill="#22232a" stroke="#33343d"/><text x="326.25" y="28" text-anchor="middle">⌫</text>
      <rect x="353.5" y="0" width="46.5" height="44" rx="8" fill="#22232a" stroke="#33343d"/><text x="376.75" y="28" text-anchor="middle">⏎</text>
    </g>

    <!-- Combo Win+Z -->
    <g transform="translate(6,518)">
      <rect x="0" y="0" width="130" height="44" rx="8" fill="#22232a" stroke="#33343d"/>
      <text x="65" y="28" text-anchor="middle" font-size="14" fill="#eee">⊞ Win+Z</text>
    </g>

    <!-- Settings collapsed -->
    <g transform="translate(6,568)">
      <rect x="0" y="0" width="400" height="36" rx="8" fill="#16161a" stroke="#2a2a30"/>
      <text x="14" y="23" font-size="13" fill="#aaa">⚙ Impostazioni</text>
    </g>

    <!-- Keyboard -->
    <g transform="translate(6,610)">
      <rect x="0" y="0" width="400" height="46" rx="8" fill="#16161a" stroke="#33343d"/>
      <text x="14" y="29" font-size="14" fill="#666">Tocca qui per digitare…</text>
    </g>
  </g>
  <!-- Phone bezel -->
  <rect x="0.5" y="0.5" width="411" height="914" rx="40" ry="40" fill="none" stroke="#222" stroke-width="1"/>
</svg>

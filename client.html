<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Remote">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<title>Phone Remote</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100dvh; background:#0e0e10; color:#eee; font-family: system-ui, -apple-system, sans-serif; overscroll-behavior: none; }
  body { display:flex; flex-direction:column; padding-bottom: env(safe-area-inset-bottom); }

  #status {
    padding: 6px 10px; font-size: 12px; background: #2a1a1a; color:#f88;
    display:flex; justify-content: space-between; align-items:center;
    transition: background .2s;
  }
  #status.ok { background:#1a3a1a; color:#9f9; }
  #status .dot { width:8px; height:8px; border-radius:50%; background: currentColor; display:inline-block; margin-right:6px; }
  #status button { background: transparent; color: inherit; border:1px solid currentColor; border-radius:6px; padding:2px 8px; font-size:11px; }

  #pad {
    flex: 1 1 auto;
    min-height: 140px;
    background: #16161a;
    border: 1px solid #2a2a30;
    margin: 6px;
    border-radius: 14px;
    display:flex; align-items:center; justify-content:center;
    color:#444; font-size: 13px;
    touch-action: none;
    position: relative;
    transition: background .08s;
  }
  #pad.tap { background: #1f3a1f; }
  #pad.drag { background:#3a2f1f; border-color:#a76; }
  #pad .hint { pointer-events:none; opacity:.6; text-align:center; padding: 0 20px; line-height:1.5; }

  .grid { display:grid; gap:6px; padding: 4px 6px; }
  .g3 { grid-template-columns: repeat(3, 1fr); }
  .g4 { grid-template-columns: repeat(4, 1fr); }
  .g5 { grid-template-columns: repeat(5, 1fr); }
  .g8 { grid-template-columns: repeat(8, 1fr); }

  button.b {
    padding: 12px 0; font-size: 14px;
    background:#22232a; color:#eee; border:1px solid #33343d; border-radius:8px;
    transition: background .08s, transform .05s;
  }
  button.b:active { background:#3a6; transform: scale(0.97); }
  button.b.on { background:#3a6; border-color:#5d8; }
  button.b.primary { background:#2a4a6a; border-color:#4a7a9a; }
  button.b.primary:active { background:#3a6; }
  button.b.muted { font-size:12px; color:#aaa; }

  #kb {
    width: calc(100% - 12px); margin: 6px;
    padding: 12px; font-size: 16px;
    background:#16161a; color:#eee; border:1px solid #33343d; border-radius:8px;
  }
  #kb:focus { border-color:#5d8; outline: none; }

  details { margin: 0 6px 4px; background:#16161a; border:1px solid #2a2a30; border-radius:8px; padding:6px 10px; }
  details summary { font-size:13px; color:#aaa; cursor:pointer; padding: 4px 0; }
  details[open] summary { color:#eee; }
  .setting { display:flex; align-items:center; gap:10px; padding:8px 0; }
  .setting label { flex: 0 0 90px; font-size:13px; color:#bbb; }
  .setting input[type=range] { flex:1; }
  .setting .val { width:30px; text-align:right; font-size:13px; color:#888; }

  /* Media drawer */
  #mediaBtn {
    background: transparent; color: inherit; border:1px solid currentColor;
    border-radius:6px; padding:2px 8px; font-size:14px; margin-right:6px;
  }
  #backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none; transition: opacity .2s;
    z-index: 90;
  }
  #backdrop.open { opacity: 1; pointer-events: auto; }
  #drawer {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: #1a1a20; border-top: 1px solid #333;
    border-radius: 18px 18px 0 0;
    padding: 8px 10px calc(16px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform .25s ease-out;
    z-index: 100; box-shadow: 0 -8px 30px rgba(0,0,0,0.6);
  }
  #drawer.open { transform: translateY(0); }
  #drawer .handle {
    width: 40px; height: 4px; background: #444; border-radius: 2px;
    margin: 6px auto 14px;
  }
  #drawer h3 { margin: 4px 4px 8px; font-size: 13px; color: #888; font-weight: normal; text-transform: uppercase; letter-spacing: .5px; }
  #drawer button.b { padding: 16px 0; font-size: 18px; }
</style>
</head>
<body>
  <div id="status"><span><span class="dot"></span><span id="statusText">Connessione...</span></span><span><button id="mediaBtn">🎵</button><button id="reconnect">Reconnect</button></span></div>

  <div id="pad">
    <div class="hint">Trackpad<br><small>1 dito = muovi · tap = sx · 2 dita tap = dx<br>doppio-tap-tieni = drag · 2 dita scorri = scroll</small></div>
  </div>

  <div class="grid g3">
    <button class="b primary" id="lclick">Click SX</button>
    <button class="b primary" id="rclick">Click DX</button>
    <button class="b" id="lockBtn">🔒 Blocca</button>
  </div>

  <div class="grid g4">
    <button class="b mod" data-mod="Control">Ctrl</button>
    <button class="b mod" data-mod="Shift">Shift</button>
    <button class="b mod" data-mod="Alt">Alt</button>
    <button class="b mod" data-mod="Meta">⌘/Super</button>
  </div>

  <div class="grid g8">
    <button class="b" data-key="Escape">Esc</button>
    <button class="b" data-key="Tab">Tab</button>
    <button class="b" data-key="ArrowUp">↑</button>
    <button class="b" data-key="ArrowDown">↓</button>
    <button class="b" data-key="ArrowLeft">←</button>
    <button class="b" data-key="ArrowRight">→</button>
    <button class="b" data-key="Backspace">⌫</button>
    <button class="b" data-key="Enter">⏎</button>
  </div>

  <div class="grid g3">
    <button class="b" data-combo="Meta+Z">⊞ Win+Z</button>
  </div>

  <details>
    <summary>⚙ Impostazioni</summary>
    <div class="setting">
      <label>Sensibilità</label>
      <input type="range" id="sens" min="0.5" max="3" step="0.1" value="1.6">
      <span class="val" id="sensVal">1.6</span>
    </div>
    <div class="setting">
      <label>Scroll</label>
      <input type="range" id="scrSpd" min="1" max="6" step="1" value="2">
      <span class="val" id="scrSpdVal">2</span>
    </div>
    <div class="setting">
      <label>Vibrazione</label>
      <input type="checkbox" id="haptic" checked>
    </div>
  </details>

  <input id="kb" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Tocca qui per digitare…">

  <div id="backdrop"></div>
  <div id="drawer">
    <div class="handle"></div>
    <h3>Media</h3>
    <div class="grid g3">
      <button class="b" data-key="PrevTrack">⏮</button>
      <button class="b" data-key="PlayPause">⏯</button>
      <button class="b" data-key="NextTrack">⏭</button>
    </div>
    <h3>Volume</h3>
    <div class="grid g3">
      <button class="b" data-key="VolumeDown">🔉</button>
      <button class="b" data-key="Mute">🔇</button>
      <button class="b" data-key="VolumeUp">🔊</button>
    </div>
    <h3>Luminosità</h3>
    <div class="grid g3">
      <button class="b" data-key="BrightnessDown">☀︎−</button>
      <button class="b" data-key="BrightnessUp">☀︎+</button>
      <button class="b muted" id="closeDrawer">Chiudi</button>
    </div>
  </div>

<script>
// ─── Settings (persisted) ───────────────────────────────────────────
const cfg = {
  sens: parseFloat(localStorage.getItem('sens') || '1.6'),
  scrSpd: parseInt(localStorage.getItem('scrSpd') || '2'),
  haptic: localStorage.getItem('haptic') !== '0',
};
const sensEl = document.getElementById('sens');
const scrEl = document.getElementById('scrSpd');
const hapticEl = document.getElementById('haptic');
sensEl.value = cfg.sens; document.getElementById('sensVal').textContent = cfg.sens.toFixed(1);
scrEl.value = cfg.scrSpd; document.getElementById('scrSpdVal').textContent = cfg.scrSpd;
hapticEl.checked = cfg.haptic;
sensEl.oninput = () => { cfg.sens = parseFloat(sensEl.value); localStorage.setItem('sens', cfg.sens); document.getElementById('sensVal').textContent = cfg.sens.toFixed(1); };
scrEl.oninput = () => { cfg.scrSpd = parseInt(scrEl.value); localStorage.setItem('scrSpd', cfg.scrSpd); document.getElementById('scrSpdVal').textContent = cfg.scrSpd; };
hapticEl.onchange = () => { cfg.haptic = hapticEl.checked; localStorage.setItem('haptic', cfg.haptic ? '1' : '0'); };

const buzz = (ms = 8) => cfg.haptic && navigator.vibrate && navigator.vibrate(ms);

// ─── Lock state ─────────────────────────────────────────────────────
let locked = false;
const lockBtn = document.getElementById('lockBtn');
lockBtn.onclick = () => {
  locked = !locked;
  lockBtn.classList.toggle('on', locked);
  lockBtn.textContent = locked ? '🔓 Sblocca' : '🔒 Blocca';
  document.getElementById('pad').style.opacity = locked ? '0.3' : '1';
};

// ─── WebSocket with auto-reconnect ──────────────────────────────────
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');
let ws = null;
let reconnectDelay = 500;

function connect() {
  statusText.textContent = 'Connessione...';
  statusEl.classList.remove('ok');
  ws = new WebSocket('ws://' + location.host);
  ws.onopen = () => {
    statusText.textContent = 'Connesso';
    statusEl.classList.add('ok');
    reconnectDelay = 500;
  };
  ws.onclose = () => {
    statusText.textContent = `Disconnesso — riprovo in ${(reconnectDelay/1000).toFixed(1)}s`;
    statusEl.classList.remove('ok');
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 1.5, 5000);
  };
  ws.onerror = () => ws && ws.close();
}
connect();
document.getElementById('reconnect').onclick = () => { if (ws) ws.close(); };

const send = (obj) => { if (!locked && ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); };

// ─── Modifiers (sticky single-use) ──────────────────────────────────
const activeMods = new Set();
const clearMods = () => {
  activeMods.clear();
  document.querySelectorAll('.mod').forEach(b => b.classList.remove('on'));
};
document.querySelectorAll('.mod').forEach(b => {
  b.onclick = () => {
    const m = b.dataset.mod;
    if (activeMods.has(m)) { activeMods.delete(m); b.classList.remove('on'); }
    else { activeMods.add(m); b.classList.add('on'); }
    buzz(5);
  };
});

// ─── Special keys ───────────────────────────────────────────────────
document.querySelectorAll('button[data-key]').forEach(b => {
  b.onclick = () => {
    send({ type: 'key', key: b.dataset.key, mods: [...activeMods] });
    clearMods();
    buzz();
  };
});

// ─── Combo shortcuts (data-combo="Control+C") ───────────────────────
document.querySelectorAll('button[data-combo]').forEach(b => {
  b.onclick = () => {
    const parts = b.dataset.combo.split('+');
    const key = parts.pop();
    send({ type: 'key', key, mods: parts });
    buzz();
  };
});

// ─── Click buttons ──────────────────────────────────────────────────
document.getElementById('lclick').onclick = () => { send({ type:'click', button:'left' }); buzz(); };
document.getElementById('rclick').onclick = () => { send({ type:'click', button:'right' }); buzz(); };

// ─── Trackpad gestures ──────────────────────────────────────────────
const pad = document.getElementById('pad');
const TAP_MAX_MS = 200;
const TAP_MAX_DIST = 10;
const DTAP_MAX_MS = 320;
const DTAP_MAX_DIST = 30;

let touches = new Map();
let lastTapTime = 0, lastTapX = 0, lastTapY = 0;
let dragging = false;
let scrollAccum = 0;
let twoFingerStart = false;
let twoFingerMoved = false;
let twoFingerActive = false;     // due dita giù, candidato a right-click
let pendingTap = null;           // { timer, x, y } click sx in attesa
const PENDING_TAP_MS = 180;

function flashTap() { pad.classList.add('tap'); setTimeout(() => pad.classList.remove('tap'), 80); }

pad.addEventListener('touchstart', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    touches.set(t.identifier, { x:t.clientX, y:t.clientY, sx:t.clientX, sy:t.clientY, t: Date.now(), moved: false });
  }
  // Double-tap-hold → promuovi il tap in attesa a drag (niente click+release prima)
  if (pendingTap && touches.size === 1 && !dragging) {
    clearTimeout(pendingTap.timer);
    pendingTap = null;
    dragging = true;
    pad.classList.add('drag');
    send({ type: 'mousedown', button: 'left' });
    buzz(15);
  }
  if (touches.size === 2) {
    twoFingerStart = true;
    twoFingerActive = true;
    twoFingerMoved = false;
    scrollAccum = 0;
  }
}, { passive:false });

pad.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (touches.size === 1 || dragging) {
    const t = e.changedTouches[0];
    const prev = touches.get(t.identifier);
    if (!prev) return;
    const rdx = t.clientX - prev.x;
    const rdy = t.clientY - prev.y;
    if (Math.abs(t.clientX - prev.sx) > TAP_MAX_DIST || Math.abs(t.clientY - prev.sy) > TAP_MAX_DIST) prev.moved = true;
    prev.x = t.clientX; prev.y = t.clientY;
    const dx = Math.round(rdx * cfg.sens);
    const dy = Math.round(rdy * cfg.sens);
    if (dx || dy) send({ type: 'move', dx, dy });
  } else if (touches.size === 2 && !dragging) {
    const t = e.changedTouches[0];
    const prev = touches.get(t.identifier);
    if (!prev) return;
    const dy = t.clientY - prev.y;
    prev.x = t.clientX; prev.y = t.clientY;
    if (Math.abs(t.clientX - prev.sx) > TAP_MAX_DIST || Math.abs(t.clientY - prev.sy) > TAP_MAX_DIST) {
      prev.moved = true; twoFingerMoved = true;
    }
    scrollAccum += dy;
    const tickSize = 18 / cfg.scrSpd;
    while (Math.abs(scrollAccum) >= tickSize) {
      const dir = scrollAccum > 0 ? 1 : -1;
      send({ type: 'scroll', dy: dir });
      scrollAccum -= dir * tickSize;
    }
  }
}, { passive:false });

pad.addEventListener('touchend', (e) => {
  e.preventDefault();
  const remainingAfter = touches.size - e.changedTouches.length;

  for (const t of e.changedTouches) {
    const data = touches.get(t.identifier);
    if (!data) continue;
    const dt = Date.now() - data.t;

    if (dragging && remainingAfter === 0) {
      send({ type: 'mouseup', button: 'left' });
      dragging = false;
      pad.classList.remove('drag');
      buzz(8);
    } else if (!data.moved && dt < TAP_MAX_MS && remainingAfter === 0 && !twoFingerActive && !dragging) {
      // Tap singolo: ritarda il click, così un secondo tap entro PENDING_TAP_MS lo promuove a drag
      const tx = t.clientX, ty = t.clientY;
      if (pendingTap) clearTimeout(pendingTap.timer);
      pendingTap = {
        x: tx, y: ty,
        timer: setTimeout(() => {
          send({ type: 'click', button: 'left' });
          lastTapTime = Date.now();
          lastTapX = tx; lastTapY = ty;
          flashTap(); buzz();
          pendingTap = null;
        }, PENDING_TAP_MS)
      };
    }
    touches.delete(t.identifier);
  }

  // Right-click 2 dita: parte UNA volta quando entrambe le dita sono via
  if (twoFingerActive && touches.size === 0) {
    if (!twoFingerMoved && !dragging) {
      send({ type: 'click', button: 'right' });
      flashTap(); buzz();
    }
    twoFingerActive = false;
    twoFingerStart = false;
    twoFingerMoved = false;
  }
}, { passive:false });

pad.addEventListener('touchcancel', () => {
  if (dragging) { send({ type: 'mouseup', button: 'left' }); dragging = false; pad.classList.remove('drag'); }
  if (pendingTap) { clearTimeout(pendingTap.timer); pendingTap = null; }
  touches.clear();
  twoFingerStart = false;
  twoFingerActive = false;
  twoFingerMoved = false;
}, { passive:false });

// ─── Keyboard input ─────────────────────────────────────────────────
const kb = document.getElementById('kb');

// IME-safe: ignore input events during composition (e.g. Asian IMEs)
let composing = false;
kb.addEventListener('compositionstart', () => composing = true);
kb.addEventListener('compositionend', (e) => {
  composing = false;
  if (e.data) { send({ type: 'type', text: e.data }); kb.value = ''; }
});

kb.addEventListener('input', () => {
  if (composing) return;
  const v = kb.value;
  if (v.length > 0) {
    if (activeMods.size > 0 && v.length === 1) {
      // Modifier + single char → send as key combo
      send({ type: 'key', key: v.toUpperCase(), mods: [...activeMods] });
      clearMods();
    } else {
      send({ type: 'type', text: v });
    }
    kb.value = '';
  }
});

kb.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === 'Backspace' || e.key === 'Tab') {
    e.preventDefault();
    send({ type: 'key', key: e.key, mods: [...activeMods] });
    clearMods();
    buzz(5);
  }
});

// Prevent zoom on double-tap of buttons
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

// ─── Media drawer ───────────────────────────────────────────────────
const drawer = document.getElementById('drawer');
const backdrop = document.getElementById('backdrop');
const openDrawer = () => { drawer.classList.add('open'); backdrop.classList.add('open'); };
const closeDrawer = () => { drawer.classList.remove('open'); backdrop.classList.remove('open'); };
document.getElementById('mediaBtn').onclick = openDrawer;
document.getElementById('closeDrawer').onclick = closeDrawer;
backdrop.onclick = closeDrawer;
// Swipe down on drawer to close
let drawerStartY = null;
drawer.addEventListener('touchstart', (e) => {
  if (e.target.closest('button')) return;
  drawerStartY = e.touches[0].clientY;
}, { passive: true });
drawer.addEventListener('touchmove', (e) => {
  if (drawerStartY === null) return;
  const dy = e.touches[0].clientY - drawerStartY;
  if (dy > 60) { closeDrawer(); drawerStartY = null; }
}, { passive: true });
drawer.addEventListener('touchend', () => { drawerStartY = null; });

// ─── Service Worker (enables PWA install) ───────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
